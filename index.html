<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name That Emoji!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game {
      text-align: center;
      padding: 1.5rem;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
      color: #f0c040;
    }

    .subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 1.5rem;
    }

    .settings {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .settings label {
      font-size: 0.95rem;
      color: #aaa;
    }

    .time-value {
      font-weight: 700;
      color: #f0c040;
      min-width: 2.5ch;
      display: inline-block;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 8px;
      background: #2a2a4a;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f0c040;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f0c040;
      border: none;
      cursor: pointer;
    }

    .card {
      background: #16213e;
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .emoji-display {
      font-size: 7rem;
      line-height: 1;
      margin-bottom: 1.25rem;
      user-select: none;
      transition: transform 0.3s;
    }

    .emoji-display.bounce {
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Timer ring */
    .timer-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
    }

    .timer-svg {
      transform: rotate(-90deg);
    }

    .timer-bg {
      fill: none;
      stroke: #2a2a4a;
      stroke-width: 6;
    }

    .timer-arc {
      fill: none;
      stroke: #f0c040;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 188.5;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }

    .timer-arc.urgent {
      stroke: #e74c3c;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #f0c040;
    }

    .timer-text.urgent {
      color: #e74c3c;
    }

    /* Letter tiles */
    .letters {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      min-height: 60px;
    }

    .tile {
      width: 44px;
      height: 52px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.35s ease;
      background: #2a2a4a;
      color: transparent;
      border: 3px solid #3a3a5a;
    }

    .tile.revealed {
      background: #f0c040;
      color: #1a1a2e;
      border-color: #f0c040;
      animation: pop 0.35s ease;
    }

    .tile.all-revealed {
      background: #2ecc71;
      color: #fff;
      border-color: #2ecc71;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .answer-label {
      font-size: 1.3rem;
      color: #ccc;
      margin-bottom: 1rem;
      display: none;
    }

    .answer-label span {
      color: #fff;
      font-weight: 700;
    }

    .hint {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1rem;
    }

    .btn {
      padding: 0.9rem 1.5rem;
      border-radius: 14px;
      border: none;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-know {
      background: #f0c040;
      color: #1a1a2e;
      font-size: 1.3rem;
    }

    .btn-reset {
      background: #0f3460;
      color: #fff;
      border: 3px solid #f0c040;
      margin-top: 0.75rem;
      display: none;
    }

    .result {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      display: none;
    }

    .result.guessed {
      background: #1a4a2e;
      border: 2px solid #2ecc71;
      color: #2ecc71;
    }

    .result.revealed {
      background: #2a2a1a;
      border: 2px solid #f0c040;
      color: #f0c040;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Name That Emoji!</h1>
    <p class="subtitle">Can you guess the feeling?</p>

    <div class="settings" id="settings">
      <label>Timer: <span class="time-value" id="timeValue">10s</span></label>
      <input type="range" id="timeSlider" min="10" max="30" step="10" value="10" />
    </div>

    <div class="card">
      <div class="emoji-display" id="emojiDisplay"></div>

      <div class="timer-wrap">
        <svg class="timer-svg" width="72" height="72" viewBox="0 0 72 72">
          <circle class="timer-bg" cx="36" cy="36" r="30" />
          <circle class="timer-arc" id="timerArc" cx="36" cy="36" r="30" />
        </svg>
        <div class="timer-text" id="timerText">10</div>
      </div>

      <div class="letters" id="letters"></div>

      <p class="hint" id="hint">Read the letters as they appear!</p>

      <div class="result" id="result"></div>
      <p class="answer-label" id="answerLabel">The answer is: <span id="answerText"></span></p>

      <button class="btn btn-know" id="knowBtn">I Know It!</button>
      <button class="btn btn-reset" id="resetBtn">Next Emoji</button>
    </div>
  </div>

  <script>
    const EMOJIS = [
      { emoji: '😀', word: 'happy' },
      { emoji: '😃', word: 'happy' },
      { emoji: '😄', word: 'glad' },
      { emoji: '😁', word: 'happy' },
      { emoji: '😆', word: 'funny' },
      { emoji: '😅', word: 'oops' },
      { emoji: '😂', word: 'funny' },
      { emoji: '🤣', word: 'funny' },
      { emoji: '😊', word: 'nice' },
      { emoji: '😇', word: 'good' },
      { emoji: '🙂', word: 'calm' },
      { emoji: '🙃', word: 'silly' },
      { emoji: '😉', word: 'wink' },
      { emoji: '😌', word: 'calm' },
      { emoji: '😍', word: 'love' },
      { emoji: '🥰', word: 'love' },
      { emoji: '😘', word: 'kiss' },
      { emoji: '😋', word: 'yummy' },
      { emoji: '😛', word: 'silly' },
      { emoji: '😜', word: 'goofy' },
      { emoji: '🤪', word: 'crazy' },
      { emoji: '🤨', word: 'hmm' },
      { emoji: '🧐', word: 'smart' },
      { emoji: '🤓', word: 'nerd' },
      { emoji: '😎', word: 'cool' },
      { emoji: '🤩', word: 'wow' },
      { emoji: '🥳', word: 'party' },
      { emoji: '😏', word: 'sly' },
      { emoji: '😒', word: 'bored' },
      { emoji: '😞', word: 'sad' },
      { emoji: '😔', word: 'sad' },
      { emoji: '😟', word: 'worry' },
      { emoji: '😕', word: 'lost' },
      { emoji: '🙁', word: 'sad' },
      { emoji: '😣', word: 'tough' },
      { emoji: '😖', word: 'upset' },
      { emoji: '😫', word: 'tired' },
      { emoji: '😩', word: 'tired' },
      { emoji: '🥺', word: 'please' },
      { emoji: '😢', word: 'cry' },
      { emoji: '😭', word: 'cry' },
      { emoji: '😤', word: 'mad' },
      { emoji: '😠', word: 'angry' },
      { emoji: '😡', word: 'angry' },
      { emoji: '🤬', word: 'angry' },
      { emoji: '😈', word: 'bad' },
      { emoji: '😮', word: 'oh' },
      { emoji: '😲', word: 'shock' },
      { emoji: '😳', word: 'shy' },
      { emoji: '🥵', word: 'hot' },
      { emoji: '🥶', word: 'cold' },
      { emoji: '😱', word: 'scary' },
      { emoji: '😨', word: 'afraid' },
      { emoji: '😰', word: 'worry' },
      { emoji: '🤗', word: 'hug' },
      { emoji: '🤔', word: 'think' },
      { emoji: '🤫', word: 'shh' },
      { emoji: '🤥', word: 'lie' },
      { emoji: '😶', word: 'quiet' },
      { emoji: '😐', word: 'meh' },
      { emoji: '😬', word: 'yikes' },
      { emoji: '🙄', word: 'ugh' },
      { emoji: '🥱', word: 'sleepy' },
      { emoji: '😴', word: 'sleep' },
      { emoji: '😵', word: 'dizzy' },
      { emoji: '🤢', word: 'sick' },
      { emoji: '🤮', word: 'sick' },
      { emoji: '🤧', word: 'achoo' },
      { emoji: '😷', word: 'sick' },
      { emoji: '🤒', word: 'fever' },
      { emoji: '🤕', word: 'hurt' },
    ];

    const CIRCUMFERENCE = 2 * Math.PI * 30;

    let currentEmoji = null;
    let gameDuration = 10;
    let timeLeft = gameDuration;
    let timerInterval = null;
    let revealInterval = null;
    let gameOver = false;
    let usedIndices = [];
    let revealOrder = [];
    let revealedCount = 0;

    const emojiDisplay = document.getElementById('emojiDisplay');
    const timerArc = document.getElementById('timerArc');
    const timerText = document.getElementById('timerText');
    const lettersEl = document.getElementById('letters');
    const knowBtn = document.getElementById('knowBtn');
    const resetBtn = document.getElementById('resetBtn');
    const result = document.getElementById('result');
    const answerLabel = document.getElementById('answerLabel');
    const answerText = document.getElementById('answerText');
    const hint = document.getElementById('hint');
    const timeSlider = document.getElementById('timeSlider');
    const timeValue = document.getElementById('timeValue');
    const settings = document.getElementById('settings');

    timeSlider.addEventListener('input', () => {
      gameDuration = parseInt(timeSlider.value);
      timeValue.textContent = gameDuration + 's';
    });

    function pickRandom() {
      if (usedIndices.length === EMOJIS.length) usedIndices = [];
      let idx;
      do { idx = Math.floor(Math.random() * EMOJIS.length); }
      while (usedIndices.includes(idx));
      usedIndices.push(idx);
      return EMOJIS[idx];
    }

    function buildTiles(word) {
      lettersEl.innerHTML = '';
      for (let i = 0; i < word.length; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = word[i];
        tile.dataset.index = i;
        lettersEl.appendChild(tile);
      }
    }

    function shuffleRevealOrder(len) {
      // Reveal first letter immediately, then random order for the rest
      const indices = [];
      for (let i = 1; i < len; i++) indices.push(i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      return [0, ...indices];
    }

    function revealLetter(index) {
      const tiles = lettersEl.querySelectorAll('.tile');
      if (tiles[index]) {
        tiles[index].classList.add('revealed');
      }
    }

    function revealAll() {
      const tiles = lettersEl.querySelectorAll('.tile');
      tiles.forEach(t => {
        t.classList.add('revealed', 'all-revealed');
      });
    }

    function updateTimer() {
      const fraction = timeLeft / gameDuration;
      timerArc.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
      timerText.textContent = timeLeft;
      const urgent = timeLeft <= 3;
      timerArc.classList.toggle('urgent', urgent);
      timerText.classList.toggle('urgent', urgent);
    }

    function startTimer() {
      timeLeft = gameDuration;
      updateTimer();

      const word = currentEmoji.word;
      revealOrder = shuffleRevealOrder(word.length);
      revealedCount = 0;

      // Reveal first letter right away
      revealLetter(revealOrder[0]);
      revealedCount = 1;

      // Schedule remaining letters evenly across the timer
      const remaining = revealOrder.length - 1;
      if (remaining > 0) {
        const intervalMs = (gameDuration * 1000) / (remaining + 1);
        revealInterval = setInterval(() => {
          if (revealedCount < revealOrder.length) {
            revealLetter(revealOrder[revealedCount]);
            revealedCount++;
          }
        }, intervalMs);
      }

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          clearInterval(revealInterval);
          endGame('timeout');
        }
      }, 1000);
    }

    function endGame(reason) {
      gameOver = true;
      clearInterval(timerInterval);
      clearInterval(revealInterval);

      revealAll();
      knowBtn.style.display = 'none';
      hint.style.display = 'none';
      resetBtn.style.display = 'block';
      settings.style.display = 'flex';
      answerLabel.style.display = 'block';
      answerText.textContent = currentEmoji.word;

      emojiDisplay.classList.add('bounce');

      result.style.display = 'block';
      if (reason === 'guessed') {
        result.className = 'result guessed';
        result.textContent = 'Great job! You got it!';
      } else {
        result.className = 'result revealed';
        result.textContent = 'Time is up! The word is shown above.';
      }
    }

    function startGame() {
      currentEmoji = pickRandom();
      gameOver = false;

      emojiDisplay.textContent = currentEmoji.emoji;
      emojiDisplay.classList.remove('bounce');
      buildTiles(currentEmoji.word);

      knowBtn.style.display = 'block';
      resetBtn.style.display = 'none';
      result.style.display = 'none';
      answerLabel.style.display = 'none';
      hint.style.display = 'block';
      settings.style.display = 'none';

      timerArc.style.strokeDashoffset = 0;
      timerArc.classList.remove('urgent');
      timerText.classList.remove('urgent');

      startTimer();
    }

    knowBtn.addEventListener('click', () => {
      if (gameOver) return;
      endGame('guessed');
    });

    resetBtn.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
